services:
  backend:
    build: .
    container_name: goatsquad-backend
    environment:
      - PYTHONPATH=/app
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goatsquad-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend